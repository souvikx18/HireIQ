services:
  postgres:
    image: postgres:16-alpine
    container_name: hireiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hireiq_secure_password
      POSTGRES_DB: hireiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hireiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hireiq-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost:80
      DATABASE_URL: "postgresql://postgres:hireiq_secure_password@postgres:5432/hireiq?schema=public"
      JWT_SECRET: "f612bb81605b61c55ef20f1244bf22c8e15bbbb9846f0c7145a55d807fa23b00"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    command: >
      sh -c "npx prisma db push && node prisma/seed.js && node src/server.js"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hireiq-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
